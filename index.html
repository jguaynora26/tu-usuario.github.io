<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Store - Tienda Saludable</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>🥗 David Store</h1>
    <p class="subtitulo">Tu tienda de alimentos saludables</p>
  </header>
  
  <div class="panel">
    <p>💰 Dinero: B/. <span id="dinero">10.00</span></p>
    <p>📦 Ventas del día: <span id="ventas">0</span></p>
    <p>💵 Ganancia total: B/. <span id="ganancia">0.00</span></p>
  </div>
  
  <h2>🥬 Tu inventario</h2>
  <div id="inventario"></div>
  
  <h2>👤 Cliente</h2>
  <div id="cliente">
    <p id="mensajeCliente">Esperando cliente...</p>
    <button id="btnAtender" onclick="atenderCliente()">Atender cliente</button>
  </div>
  
  <script src="juego.js"></script>
</body>
</html>
